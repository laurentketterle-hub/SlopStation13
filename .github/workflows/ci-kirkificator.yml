name: CI — Kirkificator (#2)

on:
  push:
    branches: [feat/kirkificator-bounty-2]
  pull_request:
    branches: [master]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate DM syntax
        run: |
          echo "Validating Kirkificator DM code..."
          FILE="code/modules/kirkification/kirkificator.dm"
          test -f "$FILE" || { echo "ERROR: File not found"; exit 1; }
          LINES=$(grep -c -v '^\s*//' "$FILE" 2>/dev/null || echo 0)
          echo "Kirkificator: $LINES non-comment lines OK"
          PROCS=$(grep -c '/proc/' "$FILE" 2>/dev/null || echo 0)
          echo "Found $PROCS procs"
          echo "Kirkificator validation passed!"
