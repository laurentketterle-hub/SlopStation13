name: CI — Tung Tung Tung Sahur (#3)

on:
  push:
    branches: [feat/tung-sahur-enhanced-bounty-3]
  pull_request:
    branches: [master]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Sahur DM code
        run: |
          echo "Validating Tung Tung Tung Sahur module..."
          FILE="code/modules/antagonists/tung_tung_sahur/tung_tung_sahur_enhanced.dm"
          test -f "$FILE" || { echo "ERROR: File not found"; exit 1; }
          LINES=$(grep -c -v '^\s*//' "$FILE" 2>/dev/null || echo 0)
          echo "Sahur module: $LINES non-comment lines"
          grep -q '/datum/antagonist/tung_tung_sahur' "$FILE" || { echo "ERROR: Missing antagonist datum"; exit 1; }
          grep -q 'Paris Peace Accords' "$FILE" || { echo "ERROR: Missing Paris Peace Accords"; exit 1; }
          grep -q '/obj/item/melee/sahur_bat' "$FILE" || { echo "ERROR: Missing sahur bat"; exit 1; }
          echo "All checks passed! TUNG TUNG TUNG SAHUR ready!"
