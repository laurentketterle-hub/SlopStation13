name: CI — TempleOS Compat (#4)

on:
  push:
    branches: [feat/templeos-compat-bounty-4]
  pull_request:
    branches: [master]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate TempleOS DM code
        run: |
          echo "Validating TempleOS compatibility module..."
          FILE="code/modules/templeos/templeos_compat.dm"
          test -f "$FILE" || { echo "ERROR: File not found"; exit 1; }
          LINES=$(grep -c -v '^\s*//' "$FILE" 2>/dev/null || echo 0)
          echo "TempleOS module: $LINES non-comment lines"
          grep -q '/datum/templeos_compat' "$FILE" || { echo "ERROR: Missing templeos_compat datum"; exit 1; }
          grep -q '/proc/welcome_templeos_players' "$FILE" || { echo "ERROR: Missing welcome proc"; exit 1; }
          grep -qi 'sumerian' "$FILE" || { echo "ERROR: Missing Sumerian content"; exit 1; }
          echo "All checks passed! TempleOS compat ready."
